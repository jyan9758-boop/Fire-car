<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.yan 的个人网站</title>
    <meta
      name="description"
      content="这是 J.yan 的个人网站，展示个人介绍、项目和联系方式。"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container nav-wrap">
        <a class="logo" href="#home">J.yan</a>
        <nav aria-label="主导航">
          <ul class="nav-list">
            <li><a href="#about">关于我</a></li>
            <li><a href="#projects">项目</a></li>
            <li><a href="#contact">联系我</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="home">
      <!-- image carousel -->
      <section class="carousel-container">
        <div class="carousel" id="carousel">
          <!-- images will be injected by script.js -->
        </div>
      </section>
      <section class="hero container">
        <p class="eyebrow">个人主页</p>
        <h1>你好，我是 J.yan</h1>
        <p class="subtitle">
          a learner, keep going
        </p>
        <div class="hero-actions">
          <a class="btn" href="#projects">查看项目</a>
          <a class="btn btn-light" href="#contact">联系我</a>
        </div>
      </section>

      <section id="about" class="section container">
        <h2>关于我</h2>
        <p>
          我正在持续学习前端开发，喜欢把想法做成实际产品。这个网站就是我的个人展示页，后续会持续更新。
        </p>
      </section>

      <section id="projects" class="section container">
        <div class="projects-header">
          <h2>项目与学习日记</h2>
          <div class="projects-actions">
            <button id="createProjectBtn" class="btn">新建项目</button>
          </div>
        </div>

        <div id="projectsArea">
          <div id="projectsList" class="cards" aria-live="polite">
            <!-- 项目卡片由 script.js 渲染 -->
          </div>

          <div id="projectView" class="project-view" hidden>
            <div class="project-view-header">
              <button id="backToList" class="btn btn-light">返回列表</button>
              <div class="project-view-actions">
                <button id="addDiaryBtn" class="btn">+</button>
              </div>
            </div>
            <section id="projectInfo" class="section">
              <h3 id="projTitle"></h3>
              <p id="projDesc"></p>
              <img id="projCover" src="" alt="项目封面" style="max-width:320px;display:block;margin-top:0.5rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);"/>
            </section>

            <section id="entriesSection" class="section">
              <h4>日记条目</h4>
              <div id="entriesList"></div>
              <div id="entryEditor" hidden>
                <h5 id="entryDate"></h5>
                <label>今天学了什么</label>
                <textarea id="entryLearn" rows="3"></textarea>
                <label>遇到什么问题</label>
                <textarea id="entryProblem" rows="3"></textarea>
                <label>明天做什么</label>
                <textarea id="entryTomorrow" rows="2"></textarea>
                <div style="margin-top:.6rem">
                  <button id="saveEntryBtn" class="btn">保存条目</button>
                  <button id="cancelEntryBtn" class="btn btn-light">取消</button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>

      <section id="contact" class="section container">
        <h2>联系我</h2>
        <p>邮箱：<a href="mailto:jyan9758@gmail.com">jyan9758@gmail.com</a></p>
        <button id="copyEmailBtn" class="btn btn-light" type="button">
          复制邮箱
        </button>
        <p id="toast" class="toast" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <small>© <span id="year"></span> J.yan. All rights reserved.</small>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
