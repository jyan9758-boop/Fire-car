<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire-car – Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #f0f0f0; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.5rem; }
        a { color: #e25c2a; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .content { margin-top: 1.5rem; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 Fire-car Dashboard</h1>
        <span>Welcome, <strong>{{ username }}</strong> | <a href="{{ url_for('logout') }}">Logout</a></span>
    </div>
    <div class="content">
        <p>Car control panel coming soon.</p>
    </div>
</body>
</html>
